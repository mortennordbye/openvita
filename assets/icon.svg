<!-- Concept A: a CV sheet whose portrait is the openself fingerprint. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="openvita">
  <title>openvita</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a31"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="250" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6aa4f8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6aa4f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#e9e2d5"/>
    </linearGradient>
    <linearGradient id="ink" x1="150" y1="110" x2="270" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6aa4f8"/>
      <stop offset="1" stop-color="#3fc1a5"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d0c0"/>
      <stop offset="1" stop-color="#bfb4a1"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>
  <g transform="rotate(-6 256 256)">
    <path d="M150 76 H310 L382 148 V420 A24 24 0 0 1 358 444 H150 A24 24 0 0 1 126 420 V100 A24 24 0 0 1 150 76 Z" fill="url(#paper)" filter="url(#lift)"/>
    <path d="M310 76 V128 A20 20 0 0 0 330 148 H382 Z" fill="url(#fold)"/>
    <g fill="none" stroke="url(#ink)" stroke-width="20" stroke-linecap="round">
      <path d="M196 236 V196 A20 20 0 0 1 236 196 V216"/>
      <path d="M164 248 V196 A52 52 0 0 1 262 172"/>
    </g>
    <g stroke-linecap="round" stroke-width="22">
      <path d="M170 312 H338" stroke="#3a3a42"/>
      <path d="M170 360 H338" stroke="#b9b0a1"/>
      <path d="M170 404 H284" stroke="#b9b0a1"/>
    </g>
  </g>
</svg>
