version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # The auto-merge workflow reads this exact group name.
      security:
        applies-to: security-updates
        patterns: ["*"]
  # The render image (WeasyPrint, poppler, LibreOffice).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  # The openself submodule. Submodule bumps carry no semver, so they are never auto-merged.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  # Test-only requirements, hash-pinned.
  - package-ecosystem: "pip"
    directory: "/tools/tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      tests:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
